[package]
name = "flax-json-date-smoke"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

# This consumer remains independent of the upstream workspaces.
[workspace]
resolver = "2"

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
